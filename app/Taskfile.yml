version: '3'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml
  ios: ./build/ios/Taskfile.yml
  android: ./build/android/Taskfile.yml

vars:
  APP_NAME: "app-image-handle"
  BIN_DIR: "bin"
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{OS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{OS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{OS}}:run"

  # 清理占用的端口
  kill-port:
    summary: Kills any process using the Vite port
    cmds:
      - task: kill-port:{{OS}}
    silent: true

  kill-port:darwin:
    platforms: [darwin]
    cmds:
      - |
        pids="$(lsof -tiTCP:{{.VITE_PORT}} -sTCP:LISTEN 2>/dev/null || true)"
        if [ -z "$pids" ]; then
          exit 0
        fi

        kill $pids 2>/dev/null || true
        sleep 1

        remaining_pids="$(lsof -tiTCP:{{.VITE_PORT}} -sTCP:LISTEN 2>/dev/null || true)"
        if [ -n "$remaining_pids" ]; then
          kill -9 $remaining_pids 2>/dev/null || true
        fi
    silent: true

  kill-port:linux:
    platforms: [linux]
    cmds:
      - 'fuser -k {{.VITE_PORT}}/tcp 2>/dev/null || true'
    silent: true

  kill-port:windows:
    platforms: [windows]
    cmds:
      - powershell -Command "Get-NetTCPConnection -LocalPort {{.VITE_PORT}} -ErrorAction SilentlyContinue | ForEach-Object { Stop-Process -Id $_.OwningProcess -Force -ErrorAction SilentlyContinue }"
    silent: true

  dev:
    summary: Runs the application in development mode
    cmds:
      - task: kill-port
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    cmds:
      - task: common:build:server

  run:server:
    summary: Runs the application in server mode
    cmds:
      - task: common:run:server

  build:docker:
    summary: Builds a Docker image for server mode deployment
    cmds:
      - task: common:build:docker

  run:docker:
    summary: Builds and runs the Docker image
    cmds:
      - task: common:run:docker
